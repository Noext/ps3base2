<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps3base &mdash; S1, the renderer draws the canvas</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc;
               font: 13px/1.4 ui-monospace, monospace; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100vw; height: 100vh; display: block; }
  #bar { position: absolute; left: 8px; bottom: 8px; padding: 6px 10px;
         background: #000a; border-radius: 4px; pointer-events: none; }
  #log { position: absolute; right: 8px; top: 8px; width: 42vw; height: 30vh;
         overflow: hidden; background: #000a; border-radius: 4px; padding: 6px;
         font-size: 11px; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div id="bar">starting&hellip;</div>
  <div id="log"></div>
</div>
<script type="module">
/* S1 -- the page owns the WebGPU device AND the canvas, and the module ADOPTS
 * both. This shape is the one the measurements chose; each step is here because
 * the alternative was measured to fail.
 *
 *  1. THE DEVICE MUST BE CREATED IN JS. A requestAdapter promise never resolves
 *     while the wasm occupies the thread, so "let the module create its own
 *     device" shows a black canvas forever (measured twice; R3 built its
 *     architecture on it).
 *  2. THE DEVICE IS THEN HANDED OVER, not re-created. emdawnwebgpu adopts an
 *     existing device through preinitializedWebGPUDevice.
 *     Measured: /tmp/S1-probe p1 -- a wasm clear reached the canvas, pixel
 *     srgba(30,200,120,1), 0 GPU errors.
 *     This refutes the premise the previous track recorded ("a GPUDevice cannot
 *     be given to wasm"): that was true of TRANSFERRING it to another realm, not
 *     of ADOPTING it in this one.
 *  3. THE RENDERER RUNS ON A GUEST PTHREAD, and a pthread's realm has its OWN,
 *     EMPTY WebGPU object table -- measured: wgpuDeviceCreateCommandEncoder
 *     returned undefined there. web/s1-bridge.js therefore declares its entries
 *     __proxy:'sync', which runs them here and blocks the pthread. Measured in
 *     p5b: with 23 port functions annotated, a pthread clears the canvas and the
 *     pixel is exact (srgba(25,191,89,1) for 0.10/0.75/0.35).
 *
 * So: no command ring replay in JavaScript, and no second renderer. The guest's
 * own pixel-exact backend draws, and the browser composites it.
 */
const bar = document.getElementById('bar');
const logEl = document.getElementById('log');
const canvas = document.getElementById('canvas');

/* The canvas context is created HERE, on the page's own thread, before the module
 * starts. This is load-bearing, not a probe: the bridge's s1_canvas_configure runs
 * through a sync proxy, and a proxied call could not create a 'webgpu' context on
 * this canvas (measured: "s1: canvas has no webgpu context" on every run, while the
 * same call from the page's thread returns a context immediately). Taking it here
 * means the bridge's getContext() returns the SAME object instead of failing. */
const canvasCtx = canvas.getContext('webgpu');
console.log('page: canvas webgpu context ' + (canvasCtx ? 'acquired' : 'UNAVAILABLE'));

function log(msg) {
  logEl.textContent = (msg + '\n' + logEl.textContent).slice(0, 4000);
  bar.textContent = String(msg).slice(0, 120);
}

window.__S1 = { ready: false, device: false, frames: 0, logs: [], error: null, stats: null };
const realLog = console.log;
console.log = (...a) => { const s = a.join(' '); window.__S1.logs.push(s); log(s); realLog(...a); };

/* --- input: DOM events become the four uint16 words cellPadGetData reads ---- */
const KEYS = {
  KeyW: [2, 0x10], KeyD: [2, 0x20], KeyS: [2, 0x40], KeyA: [2, 0x80],
  ArrowUp: [2, 0x10], ArrowRight: [2, 0x20], ArrowDown: [2, 0x40], ArrowLeft: [2, 0x80],
  Enter: [2, 0x08], Escape: [2, 0x01], Backspace: [2, 0x01],
  Space: [3, 0x40], KeyZ: [3, 0x40], KeyX: [3, 0x20], KeyC: [3, 0x10], KeyV: [3, 0x80],
  KeyQ: [3, 0x04], KeyE: [3, 0x08], ShiftLeft: [3, 0x01], ControlLeft: [3, 0x02],
};
const held = new Set();
addEventListener('keydown', (e) => { if (KEYS[e.code]) { held.add(e.code); e.preventDefault(); } });
addEventListener('keyup', (e) => { if (KEYS[e.code]) { held.delete(e.code); e.preventDefault(); } });
addEventListener('blur', () => held.clear());

let mod = null;
let padAddr = 0, connAddr = 0;

/* The pad words are written straight into the module's heap: no message per
 * poll, and the guest reads them through the addresses C publishes. */
function publishPad() {
  if (!mod || !mod.HEAPU16 || !padAddr) return;
  const w = [0, 0, 0, 0];
  let connected = 0;
  for (const code of held) { const m = KEYS[code]; if (m) { w[m[0]] |= m[1]; connected = 1; } }
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const pad of pads) {
    if (!pad || !pad.connected) continue;
    connected = 1;
    const MAP = [[3,0x40],[3,0x20],[3,0x80],[3,0x10],[3,0x04],[3,0x08],[3,0x01],[3,0x02],
                 [2,0x01],[2,0x08],[2,0x02],[2,0x04],[2,0x10],[2,0x40],[2,0x80],[2,0x20]];
    for (const [i, m] of MAP.entries()) { const b = pad.buttons[i]; if (b && b.pressed) w[m[0]] |= m[1]; }
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    if (ax < -0.5) w[2] |= 0x80;
    if (ax > 0.5) w[2] |= 0x20;
    if (ay < -0.5) w[2] |= 0x10;
    if (ay > 0.5) w[2] |= 0x40;
    break;
  }
  const base = padAddr >> 1;
  mod.HEAPU16[base + 0] = w[0];
  mod.HEAPU16[base + 1] = w[1];
  mod.HEAPU16[base + 2] = w[2];
  mod.HEAPU16[base + 3] = w[3];
  if (mod.HEAPU32 && connAddr) mod.HEAPU32[connAddr >> 2] = connected;
}
setInterval(publishPad, 16);

async function main() {
  if (!('gpu' in navigator)) {
    log('WebGPU is not available. Enable chrome://flags/#enable-unsafe-webgpu and ' +
        'chrome://flags/#enable-vulkan, then restart the browser.');
    return;
  }
  let adapter = null;
  for (let i = 0; i < 100 && !adapter; i++) {
    adapter = await navigator.gpu.requestAdapter();
    if (!adapter) await new Promise((r) => setTimeout(r, 100));
  }
  if (!adapter) { log('no adapter after 100 attempts'); return; }
  const device = await adapter.requestDevice();
  window.__S1.device = true;
  log('page created the device (' + (adapter.info ? adapter.info.vendor : 'unknown') + ')');
  device.addEventListener && device.addEventListener('uncapturederror', (e) => {
    window.__S1.error = String(e.error && e.error.message);
    log('UNCAPTURED ' + window.__S1.error);
  });

  const m = await import(new URL('./game.js', self.location.href).href);
  mod = await m.default({
    locateFile: (p) => new URL('./' + p, self.location.href).href,
    /* Sent to the DevTools console as well as the DOM: the capture harness only
     * reads console.log, so a module whose output went to the DOM alone would
     * measure as "no rsx lines at all" and look like a renderer that never
     * started. */
    print: (t) => { window.__S1.logs.push(t); console.log(t); },
    printErr: (t) => { window.__S1.logs.push(t); console.log(t); },
    noExitRuntime: true,
    /* Read by emdawnwebgpu and by web/s1-bridge.js. */
    preinitializedWebGPUDevice: device,
    s1Canvas: canvas,
  });
  log('module booted; the device is adopted and the canvas is the render target');

  try {
    padAddr = mod._ps3_pad_words_address() | 0;
    connAddr = mod._ps3_pad_connected_address() | 0;
    log('pad seam 0x' + (padAddr >>> 0).toString(16));
  } catch (e) { log('pad seam unavailable: ' + e.message); }

  /* ==================================================================
   * THE REPLAY LOOP, ON THE PAGE'S THREAD.
   *
   * This is the whole point of the architecture. The game's main() runs in a
   * pthread (-sPROXY_TO_PTHREAD), and a pthread has an empty WebGPU object table:
   * every port entry is __proxy:'sync', so a call from there is a blocking round
   * trip that starves the FIFO (measured: n_method frozen at 378, busy 99.8%).
   *
   * So the RSX thread only RECORDS into the ring, and this callback -- the
   * browser's own main-thread animation callback -- drains it and issues the
   * WebGPU calls. requestAnimationFrame, not emscripten_set_main_loop: a main loop
   * registered from the pthread would run on the pthread.
   *
   * The device is adopted HERE, once, before the first frame. t1_replay_adopt
   * records this thread as the owner, and the backend refuses any later device
   * call from another thread.
   */
  let replayAdopted = false;
  let replayTicks = 0;
  let replayPopped = 0;
  let replayLastLog = 0;
  const statsAddr = (() => { try { return mod._t1_replay_stats ? mod._t1_replay_stats() >>> 0 : 0; } catch (e) { return 0; } })();
  const off = (() => {
    const o = {};
    try {
      for (let i = 0; i <= 18; i++) o[i] = mod._t1_replay_stat_offset(i) >>> 0;
    } catch (e) {}
    return o;
  })();
  function stat(i) {
    if (!statsAddr || off[i] === undefined || off[i] === 0xFFFFFFFF) return 0;
    /* mod.HEAPU32 is re-read EVERY call: -sALLOW_MEMORY_GROWTH replaces the view
     * when the heap grows, and a captured view then reads a detached buffer --
     * measured as counters frozen at their first value while the backend replayed
     * 1491 draws. */
    const heap = mod.HEAPU32;
    if (!heap) return 0;
    const p = (statsAddr + off[i]) >>> 2;
    const lo = heap[p] >>> 0;
    const hi = heap[p + 1] >>> 0;
    return hi * 4294967296 + lo;
  }

  function replayTick() {
    try {
      if (!replayAdopted) {
        /* The device comes from the PORT, in C++: s1_adopt_device() is a JS library
         * entry the wasm imports, so it is not visible as mod._s1_adopt_device from
         * here. Measured: that property is undefined, the page passed 0, and the
         * replay logged "adopt_device: null device" and never started. */
        const ok = mod._t1_replay_adopt(canvas.width, canvas.height);
        replayAdopted = true;
        console.log('T1REPLAY adopt ok=' + ok + ' (device handle is taken in C++)');
        if (!ok) { requestAnimationFrame(replayTick); return; }
      }
      const n = mod._t1_replay_frame();
      replayTicks++;
      replayPopped += n;
      const now = performance.now();
      if (now - replayLastLog > 2000) {
        replayLastLog = now;
        console.log('T1REPLAY ticks=' + replayTicks + ' popped=' + stat(0) +
                    ' draws_seen=' + stat(3) + ' draws_ready=' + stat(4) +
                    ' no_shader=' + stat(5) + ' no_vertex=' + stat(6) +
                    ' clears=' + stat(7) + ' flips=' + stat(8) +
                    ' bufs=' + stat(10) + ' texs=' + stat(11) + ' shaders=' + stat(12) +
                    ' peak=' + stat(13) + '/' + stat(14) +
                    ' offthread=' + stat(16));
      }
    } catch (e) {
      if (!window.__S1.replayError) {
        window.__S1.replayError = String(e && e.message || e);
        console.log('T1REPLAY ERROR ' + window.__S1.replayError);
      }
    }
    requestAnimationFrame(replayTick);
  }
  window.__S1.replay = { adopted: () => replayAdopted, ticks: () => replayTicks, popped: () => replayPopped };
  /* NOT started here: this block runs before `mod` is assigned (the module is awaited
   * further down), so the first tick would see mod undefined and adopt a null device.
   * Measured: "T1REPLAY adopt dev=0x0 ok=0" at t=0.004 s, then a TypeError reading
   * the stats address. The loop is started after the module boots, below. */
  /* The module exists by now (this block is inside main(), after the await), so the
   * stats address and the device handle are real. Starting the loop earlier measured
   * "adopt dev=0x0" and a TypeError on the stats address. */
  requestAnimationFrame(replayTick);

  /* ==================================================================
   * CANVAS READBACK, OWNED BY THE PAGE.
   *
   * tools/x-capture.mjs reads the canvas through window.__x6Readback, which its
   * --auto-hook installs. That hook bails on this page: it is injected before any
   * page script runs, and at that moment GPUCanvasContext is still undefined, so
   * its guard returns and no readback function is ever installed (measured: no
   * __x6Readback in the page, "readback capture skipped").
   *
   * The page has the device and the context, so it can do the copy itself: render
   * the canvas into an offscreen texture with COPY_SRC, then map it back. The
   * canvas is configured with COPY_SRC in s1-bridge.js for exactly this.
   */
  window.__x6Readback = async function () {
    try {
      /* TWO-PHASE CAPTURE, because the copy must happen at the frame boundary.
       *
       * Reading the canvas from here does not work: getCurrentTexture() invalidates
       * the texture the replay drew into, and after the submit the encoder is already
       * finished (measured: 1008 draws replayed, 0 GPU errors, capture refused every
       * time). So the page REQUESTS a capture, the backend takes it inside end_frame
       * where the target is still valid, and the page reads the bytes back next frame. */
      const wPtr = window.__t1CapW || (window.__t1CapW = mod._malloc ? mod._malloc(8) : 0);
      if (!wPtr) { console.log('T1READBACK no malloc'); return null; }
      mod._t1_replay_capture_request();
      /* WAIT UNTIL THE COPY HAS ACTUALLY BEEN TAKEN.
       *
       * A fixed two-frame wait was not enough: the replay's end_frame() runs on its
       * own animation tick, and capture_now() was being called before it -- measured:
       * "capture_now: ready 0 tex 0 w 0 h 0" four times while "capture copied to
       * persistent texture 1280x720" appeared later. So poll the request until the
       * backend reports a capture ready, with a bounded number of frames. */
      let addr = 0;
      for (let attempt = 0; attempt < 30; attempt++) {
        await new Promise((r) => requestAnimationFrame(r));
        mod._t1_replay_capture_now();
        addr = mod._t1_replay_capture(wPtr, wPtr + 4);
        if (addr) break;
      }
      const heap = mod.HEAPU32;
      const w = heap[wPtr >> 2] >>> 0;
      const h = heap[(wPtr + 4) >> 2] >>> 0;
      if (!addr || !w || !h) { console.log('T1READBACK capture still empty'); return null; }
      const src = new Uint8Array(mod.HEAPU8.buffer, addr, w * h * 4);
      const rgba = new Uint8Array(w * h * 4);
      rgba.set(src);
      let bin = '';
      for (let j = 0; j < rgba.length; j += 0x8000) bin += String.fromCharCode.apply(null, rgba.subarray(j, j + 0x8000));
      console.log('T1READBACK captured ' + w + 'x' + h + ' from the backend target');
      return { w: w, h: h, format: 'rgba8unorm', b64: btoa(bin),
               meta: { source: 'backend', addr: addr } };
    } catch (e) {
      console.log('T1READBACK ERROR ' + (e && e.message || e));
      return null;
    }
  };
  console.log('T1READBACK installed (two-phase backend capture)');

  window.__S1.ready = true;
  /* The renderer's OWN counters, not a narrative. g_stats.draws is the number of
   * draws that reached a pipeline; g_skip_lines says, by source line, how many
   * turned back -- and that is the only thing that distinguishes "no draw was
   * issued by the guest" from "every draw was refused at line N". */
  setInterval(() => {
    try {
      const s = window.__S1.stats || {};
      if (typeof mod._r3_draws === 'function') {
        s.draws = mod._r3_draws();
        s.skipped = mod._r3_skipped();
        s.n_method = mod._r3_n_method_get ? mod._r3_n_method_get() : -1;
        s.n_enabled_false = mod._r3_n_enabled_false_get ? mod._r3_n_enabled_false_get() : -1;
        /* mod.UTF8ToString is NOT available unless it is in
         * EXPORTED_RUNTIME_METHODS; calling an absent function here would throw
         * and take the whole interval with it, which is why an earlier run showed
         * no S1STATS line at all. The module also exposes HEAPU8, so the string is
         * read directly and a missing one degrades to a marker instead of an
         * exception. */
        if (mod._r3_skip_reasons && mod.HEAPU8) {
          const p = mod._r3_skip_reasons() >>> 0;
          if (p) {
            let end = p, n = 0;
            while (mod.HEAPU8[end] && n < 512) { end++; n++; }
            s.skip = '';
            for (let i = p; i < end; i++) s.skip += String.fromCharCode(mod.HEAPU8[i]);
          } else s.skip = '';
        }
      }
      if (typeof mod._rsx_ring_stat === 'function') {
        s.ring = [];
        for (let i = 0; i < 19; i++) s.ring.push(mod._rsx_ring_stat(i) >>> 0);
      }
      window.__S1.stats = s;
      /* Printed once per interval so the capture harness records it: a counter
       * that only lives in window.__S1 is a claim, not a measurement. */
      if (s.draws !== undefined) {
        console.log('S1STATS draws=' + s.draws + ' skipped=' + s.skipped +
                    ' n_method=' + s.n_method + ' skip=[' + (s.skip || '') + ']' +
                    (s.ring ? ' recs=' + s.ring[0] + ' ring_draws=' + s.ring[10] : ''));
      }
    } catch (e) {}
  }, 2000);
}

main().catch((e) => { window.__S1.error = String(e && e.stack || e); log('ERROR ' + window.__S1.error); });
</script>
</body>
</html>
